<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>palindrome checker</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/media-queries.css">
    <link
      rel="shortcut icon"
      href="assets/images/favicon-16x16.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <main role="main">
      <div class="container">
        <section class="text colorDiv" aria-labelledby="main-title">
          <h1 id="main-title">is it a palindrome?</h1>

          <form class="enter-text" aria-labelledby="form-title" role="form">
            <h2 id="form-title" class="color-text">enter the text here:</h2>

            <div class="input-group">
              <label for="text-input" class="sr-only">text to check</label>
              <input type="text" id="text-input" name="text" aria-required="true" />
              <button id="check-btn" type="submit">check</button>
            </div>
          </form>

          <section id="explain" aria-labelledby="result-description">
            <p id="result-description" class="sr-only">explanation of palindrome</p>
            <p id="result" class="initial-text" aria-live="polite">
              a <em>palindrome</em> is a word or sentence that's spelled the
              same way both forward and backward, ignoring punctuation, case,
              and spacing.
            </p>
          </section>
        </section>

        <div id="image" role="img" aria-label="Artistic image with a comic-style character from Jujutsu Kaisen"></div>
      </div>
    </main>
    <script src="assets/js/script.js"></script>
  </body>
</html>
